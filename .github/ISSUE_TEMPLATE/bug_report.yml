name: Bug report
description: Report reproducible behavior
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output (remove secrets and personal data)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python and project version

