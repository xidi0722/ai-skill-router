name: Offline checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" -c constraints-dev.txt
      - run: python -m pytest -q
      - run: python examples/offline_demo.py
      - run: python examples/python_integration.py
      - run: python examples/http_integration.py
      - run: python examples/weather_evidence_gap.py
      - run: python examples/custom_tool.py

