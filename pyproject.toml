[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-model-router"
version = "0.1.0"
description = "Evidence-aware discovery and routing for models, tools, and scientific services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "sympy>=1.12",
  "tzdata>=2024.1; platform_system == 'Windows'"
]
license = "Apache-2.0"
authors = [{ name = "Universal Model Router contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11"
]

[project.scripts]
umr = "umr.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umr = ["schemas/*.json"]
